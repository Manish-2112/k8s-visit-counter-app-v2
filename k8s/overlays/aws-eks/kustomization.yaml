apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-alb.yaml

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - APP_ENV=aws-eks-production

# Jenkins dynamically overrides image tags during CI/CD rollout
images:
  - name: visit-counter-backend
    newName: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/visit-counter-backend
    newTag: latest
  - name: visit-counter-frontend
    newName: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/visit-counter-frontend
    newTag: latest
