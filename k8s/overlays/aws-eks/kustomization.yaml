apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-alb.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: app-config
    namespace: visit-counter
    behavior: merge
    literals:
      - APP_ENV=aws-eks-production

# Jenkins dynamically overrides image tags during CI/CD rollout
images:
  - name: visit-counter-backend
    newName: 091899373411.dkr.ecr.ap-south-1.amazonaws.com/visit-counter-backend
    newTag: latest
  - name: visit-counter-frontend
    newName: 091899373411.dkr.ecr.ap-south-1.amazonaws.com/visit-counter-frontend
    newTag: latest