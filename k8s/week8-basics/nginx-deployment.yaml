# Week 8 Assignment: Deploy Nginx on Kubernetes & test pod health
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-basics-demo
  labels:
    app: nginx-basics
    phase: week-8
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-basics
  template:
    metadata:
      labels:
        app: nginx-basics
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-basics-service
spec:
  type: NodePort
  selector:
    app: nginx-basics
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30088
