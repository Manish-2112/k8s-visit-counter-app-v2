# Production Availability Guardrail: Ensure at least 1 replica stays up during voluntary disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: visit-counter
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: visit-counter
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
