# NOTE: In AWS EKS production, Jenkins overwrites this Secret dynamically
# from AWS Systems Manager (SSM) Parameter Store during deployment.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: visit-counter
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "change-me-via-aws-ssm"
