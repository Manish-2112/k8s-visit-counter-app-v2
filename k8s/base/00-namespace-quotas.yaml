apiVersion: v1
kind: Namespace
metadata:
  name: visit-counter
  labels:
    environment: production
---
# Week 9: Namespace-level ResourceQuota & LimitRange (Production Guardrails)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: visit-counter-quota
  namespace: visit-counter
spec:
  hard:
    pods: "20"
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: visit-counter
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "300m"
        memory: "256Mi"
